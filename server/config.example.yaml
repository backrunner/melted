# Harness / model secrets and process isolation: docs/agent-collection.md

# Optional natural-language preference compilation / automatic organization.
# JSON environment equivalent: PROCESSING_CONFIG (Cloudflare: Worker secret).
# See docs/processing.md. Do not commit real credentials.
